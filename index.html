<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kniffel Extreme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<!-- Firebase App (the core Firebase SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<!-- Firebase Realtime Database -->
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>

<style>
  :root{
    --felt-dark:#123027;
    --felt:#1c4436;
    --felt-light:#26594a;
    --ivory:#f4efdf;
    --ivory-dim:#ddd5bd;
    --red:#b4402f;
    --red-dim:#8f3327;
    --gold:#c9a24b;
    --gold-dim:#9c7d3a;
    --ink:#16241f;
    --banner:#e8d97a;
    --banner-ink:#3a3212;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:radial-gradient(1200px 600px at 50% -10%, var(--felt-light), var(--felt-dark) 70%);
    color:var(--ivory);
    font-family:'Manrope',system-ui,sans-serif;
    padding:24px 14px 60px;
  }
  .wrap{max-width:980px;margin:0 auto;}
  h1{
    font-family:'Fraunces',serif;font-weight:700;
    font-size:clamp(26px,5vw,40px);
    margin:0 0 18px;letter-spacing:-0.01em;text-align:center;
  }
  .sub{color:var(--ivory-dim);margin:0 0 20px;font-size:14px;text-align:center;}
  .card{
    background:rgba(244,239,223,0.05);
    border:1px solid rgba(244,239,223,0.14);
    border-radius:14px;padding:20px;margin-bottom:16px;
  }
  label{font-size:13px;color:var(--ivory-dim);}
  button{
    font-family:'Manrope',sans-serif;font-weight:700;font-size:15px;
    border:none;border-radius:10px;padding:13px 18px;cursor:pointer;
    transition:transform .08s ease, filter .15s ease;
  }
  button:active{transform:scale(0.97);}
  button:disabled{opacity:0.35;cursor:not-allowed;}
  .btn-primary{background:var(--gold);color:#2a2110;width:100%;}
  .btn-primary:hover:not(:disabled){filter:brightness(1.08);}
  .btn-ghost{background:rgba(244,239,223,0.12);color:var(--ivory);font-size:13.5px;padding:9px 14px;}
  .btn-ghost:hover:not(:disabled){background:rgba(244,239,223,0.2);}
  .btn-red{background:var(--red);color:var(--ivory);font-size:13.5px;padding:9px 14px;}
  .btn-red:hover:not(:disabled){background:var(--red-dim);}
  .err{color:#e8a06b;font-size:14px;margin-top:8px;text-align:center;}
  .picker{display:flex;gap:12px;}
  .picker button{flex:1;padding:18px 10px;font-size:17px;}

  .board{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:760px){ .board{grid-template-columns:340px 1fr;align-items:start;} }

  .players-row{display:flex;gap:22px;justify-content:center;margin-bottom:14px;}
  .avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .avatar{
    width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:26px;color:#221a0c;
    box-shadow:0 3px 0 rgba(0,0,0,0.25), 0 5px 10px rgba(0,0,0,0.3);
    border:2px solid rgba(244,239,223,0.4);
  }
  .avatar.gold{background:linear-gradient(160deg,#e7c876,var(--gold-dim));}
  .avatar.red{background:linear-gradient(160deg,#d97a63,var(--red-dim));color:var(--ivory);}
  .avatar.turn{box-shadow:0 0 0 3px var(--banner), 0 3px 0 rgba(0,0,0,0.25), 0 5px 10px rgba(0,0,0,0.3);}
  .avatar-name{font-size:13px;color:var(--ivory-dim);}
  .avatar-name.turn{color:var(--banner);font-weight:700;}

  .banner{
    background:var(--banner);color:var(--banner-ink);border-radius:10px;
    padding:13px 16px;font-size:14.5px;font-weight:600;margin-bottom:16px;
    text-align:center;line-height:1.4;
  }

  .dice-tray{
    position:relative;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;
    padding:30px 14px;margin:0 0 16px;min-height:150px;
    background:radial-gradient(ellipse at 50% 40%, rgba(0,0,0,0.25), rgba(0,0,0,0.1));
    border-radius:16px;border:1px solid rgba(244,239,223,0.1);
  }
  .die{
    width:56px;height:56px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-weight:700;font-size:23px;
    background:var(--ivory);color:var(--ink);
    box-shadow:0 4px 0 rgba(0,0,0,0.25), 0 6px 10px rgba(0,0,0,0.35);
    cursor:pointer;user-select:none;
    transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  }
  .die.red{background:linear-gradient(160deg, #d05a44, var(--red));color:var(--ivory);}
  .die.held{opacity:0.5;box-shadow:0 1px 0 rgba(0,0,0,0.2);}
  .die.empty{background:rgba(244,239,223,0.15);color:transparent;cursor:default;box-shadow:none;}

  .controls{margin-bottom:10px;}
  .controls-secondary{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
  .meta{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--ivory-dim);margin-bottom:6px;}
  .meta b{color:var(--ivory);}
  .chip{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:3px;}
  .chip.spent{background:rgba(244,239,223,0.15);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{padding:8px 8px;text-align:left;border-bottom:1px solid rgba(244,239,223,0.09);}
  th{font-weight:700;color:var(--ivory-dim);font-size:12px;}
  td.cat{color:var(--ivory);}
  td.score{text-align:center;font-family:'Fraunces',serif;font-weight:600;width:70px;}
  td.score.mine{cursor:pointer;}
  td.score.mine:hover{background:rgba(201,162,75,0.18);border-radius:6px;}
  td.score .empty-preview{color:rgba(244,239,223,0.3);}
  .section-label td{
    padding-top:14px;font-family:'Fraunces',serif;font-weight:700;font-size:14px;
    color:var(--gold);border-bottom:1px solid rgba(201,162,75,0.3);
  }
  .log{max-height:110px;overflow-y:auto;font-size:12px;color:var(--ivory-dim);display:flex;flex-direction:column-reverse;gap:3px;}
  .winner-banner{text-align:center;font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:var(--gold);margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ---- FIREBASE INIT ----
const firebaseConfig = {
  apiKey: "AIzaSyA5K-tyvfKVuPqf4w7-oyrgVgMUDb1oReE",
  authDomain: "kniffel-extreme-16195.firebaseapp.com",
  databaseURL: "https://kniffel-extreme-16195-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kniffel-extreme-16195",
  storageBucket: "kniffel-extreme-16195.firebasestorage.app",
  messagingSenderId: "58458178290",
  appId: "1:58458178290:web:ee30556e8c9916cdc2866b",
  measurementId: "G-FX8PSZCWTP"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const roomRef = database.ref('games/kniffel-shared-room');

// ---- GAME LOGIC ----
const PLAYER_NAMES = ['Lola','Martina'];

const CATS = [
  {id:'ones',   label:'Ones',  sec:'upper'},
  {id:'twos',   label:'Twos',  sec:'upper'},
  {id:'threes', label:'Threes',  sec:'upper'},
  {id:'fours',  label:'Fours',  sec:'upper'},
  {id:'fives',  label:'Fives',  sec:'upper'},
  {id:'sixes',  label:'Sixes', sec:'upper'},
  {id:'tris',        label:'Three of a kind',      sec:'lower'},
  {id:'poker',       label:'Four of a kind',      sec:'lower'},
  {id:'dueCoppie',   label:'Two Pairs',       sec:'lower'},
  {id:'treCoppie',   label:'Three Pairs',       sec:'lower'},
  {id:'dueTris',     label:'Two Threes',      sec:'lower'},
  {id:'full',        label:'Full House',       sec:'lower'},
  {id:'grandeFull',  label:'Large Full House',sec:'lower'},
  {id:'scalaCorta',  label:'Small Straight',    sec:'lower'},
  {id:'scalaLunga',  label:'Large Straight',     sec:'lower'},
  {id:'highway',     label:'Highway',          sec:'lower'},
  {id:'kniffel',        label:'Kniffel',          sec:'lower'},
  {id:'kniffelExtreme', label:'Kniffel Extreme',  sec:'lower'},
  {id:'sommaMax10',  label:'10 or less',  sec:'lower'},
  {id:'sommaMin33',  label:'33 or more',     sec:'lower'},
  {id:'chance',      label:'Chance',           sec:'lower'},
  {id:'superChance', label:'Super Chance',     sec:'lower'},
];

// We use 0 instead of null because Firebase drops null array values
function counts(dice){
  const c={};
  dice.slice(0,5).forEach(v=>{ if(v!==0) c[v]=(c[v]||0)+1; });
  const r=dice[5];
  if(r!==0 && r>=1 && r<=6) c[r]=(c[r]||0)+1;
  return c;
}
function sumAll(dice){return dice.reduce((a,b)=>a+(b||0),0);}
function consecutiveRun(keysSorted, len){
  for(let i=0;i<=keysSorted.length-len;i++){
    let ok=true;
    for(let j=1;j<len;j++) if(keysSorted[i+j]!==keysSorted[i]+j){ok=false;break;}
    if(ok) return true;
  }
  return false;
}
function evalCategory(id, dice){
  const c = counts(dice);
  const vals = Object.values(c);
  const keys = Object.keys(c).map(Number).sort((a,b)=>a-b);
  const max = vals.length?Math.max(...vals):0;
  const sum = sumAll(dice);
  switch(id){
    case 'ones': return {valid:true, score:(c[1]||0)*1};
    case 'twos': return {valid:true, score:(c[2]||0)*2};
    case 'threes': return {valid:true, score:(c[3]||0)*3};
    case 'fours': return {valid:true, score:(c[4]||0)*4};
    case 'fives': return {valid:true, score:(c[5]||0)*5};
    case 'sixes': return {valid:true, score:(c[6]||0)*6};
    case 'tris': { const v=max>=3; return {valid:v, score:v?sum:0}; }
    case 'poker': { const v=max>=4; return {valid:v, score:v?sum:0}; }
    case 'dueCoppie': { const pairVals = keys.filter(k=>c[k]>=2); const v = pairVals.length>=2; return {valid:v, score:v?sum:0}; }
    case 'treCoppie': { const pairVals = keys.filter(k=>c[k]>=2); const v=pairVals.length>=3; return {valid:v, score:v?35:0}; }
    case 'dueTris': { const trisVals = keys.filter(k=>c[k]>=3); const v=trisVals.length>=2; return {valid:v, score:v?45:0}; }
    case 'full': { const sorted=vals.slice().sort((a,b)=>a-b); const v = sorted.length===2 && sorted[0]===2 && sorted[1]===3; return {valid:v, score:v?25:0}; }
    case 'grandeFull': { const hasFour = keys.some(k=>c[k]>=4); const v = hasFour && keys.filter(k=>c[k]>=2).length>=2; return {valid:v, score:v?45:0}; }
    case 'scalaCorta': { const v=consecutiveRun(keys,4); return {valid:v, score:v?30:0}; }
    case 'scalaLunga': { const v=consecutiveRun(keys,5); return {valid:v, score:v?40:0}; }
    case 'highway': { const v = keys.length===6 && keys.every(k=>c[k]===1) && keys[0]===1 && keys[5]===6; return {valid:v, score:v?50:0}; }
    case 'kniffel': { const v = max>=5; return {valid:v, score:v?50:0}; }
    case 'kniffelExtreme': { const v = max===6; return {valid:v, score:v?75:0}; }
    case 'sommaMax10': { const v = sum<=10; return {valid:v, score:v?40:0}; }
    case 'sommaMin33': { const v = sum>=33; return {valid:v, score:v?40:0}; }
    case 'chance': return {valid:true, score:sum};
    case 'superChance': return {valid:true, score:sum*2};
  }
  return {valid:false, score:0};
}

// ---- App state ----
let myId = 'p_' + Math.random().toString(36).slice(2,9);
let myName = '';
let game = null;
let phase = 'join'; // join | waiting | play
let joinError = '';

// We use -1 instead of null for scores so Firebase doesn't delete the keys
function emptyScores(){ const o={}; CATS.forEach(c=>o[c.id]= -1); return o; }

function newGame(){
  return {
    players: [],
    turnIndex: 0,
    dice: [0,0,0,0,0,0],
    held: [false,false,false,false,false,false],
    rollsLeft: 3,
    usedExtraThisTurn: false,
    chipsLeft: {},
    scores: {},
    log: [],
    gameOver: false,
    rolledThisTurn: false,
    updatedAt: Date.now()
  };
}

async function saveGame(g){
  g.updatedAt = Date.now();
  try{ 
    await roomRef.set(g); 
  } catch(e){ 
    console.error('Firebase storage error', e); 
  }
}

function log(g, text){
  if(!g.log) g.log = [];
  g.log.push(text);
  if(g.log.length>40) g.log.shift();
}

// Subscribe to Firebase real-time updates
roomRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if (data) {
    game = data;
    // Firebase drops empty arrays, ensure they exist locally
    if(!game.players) game.players = [];
    if(!game.dice) game.dice = [0,0,0,0,0,0];
    if(!game.held) game.held = [false,false,false,false,false,false];
    if(!game.log) game.log = [];
    if(!game.chipsLeft) game.chipsLeft = {};
    if(!game.scores) game.scores = {};
    
    // Crucial fix: Only jump to the game board IF the player has already chosen a name
    if (phase !== 'join') {
      phase = game.players.length >= 2 ? 'play' : 'waiting';
    }
    render();
  }
});

async function quickJoin(name){
  myName = name;
  joinError='';
  
  const snapshot = await roomRef.once('value');
  let g = snapshot.val();
  
  if(!g){ 
    g = newGame(); 
  } else {
    if(!g.players) g.players = [];
    if(!g.chipsLeft) g.chipsLeft = {};
    if(!g.scores) g.scores = {};
  }
  
  const existing = g.players.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(existing){
    // If the player reconnects, reassign their original ID
    myId = existing.id; 
  } else if(g.players.length < 2){
    g.players.push({id: myId, name: name});
    g.chipsLeft[myId] = 3;
    g.scores[myId] = emptyScores();
    log(g, name + ' joined the game.');
  } else {
    joinError = 'The room already has two players.';
    render();
    return;
  }
  
  // Now that a name is clicked, manually move away from the 'join' phase
  phase = g.players.length >= 2 ? 'play' : 'waiting';
  await saveGame(g);
  render();
}

function myTurn(){
  if(!game || game.players.length<2) return false;
  return game.players[game.turnIndex].id === myId;
}
function opponent(){
  if(!game) return null;
  return game.players.find(p=>p.id!==myId) || null;
}

async function rollDice(){
  if(!myTurn() || game.rollsLeft<=0 || game.gameOver) return;
  const d = game.dice.slice();
  for(let i=0;i<5;i++) if(!game.held[i]) d[i] = 1+Math.floor(Math.random()*6);
  if(!game.held[5]) d[5] = 1+Math.floor(Math.random()*10);
  game.dice = d;
  game.rollsLeft -= 1;
  game.rolledThisTurn = true;
  log(game, game.players[game.turnIndex].name+' rolled the dice.');
  await saveGame(game);
}

async function toggleHold(i){
  if(!myTurn() || !game.rolledThisTurn || game.gameOver) return;
  game.held[i] = !game.held[i];
  await saveGame(game);
}

async function useChip(){
  if(!myTurn() || game.rollsLeft>0 || game.usedExtraThisTurn || game.gameOver) return;
  if((game.chipsLeft[myId]||0)<=0) return;
  game.chipsLeft[myId] -= 1;
  game.rollsLeft = 1;
  game.usedExtraThisTurn = true;
  log(game, game.players[game.turnIndex].name+' used a chip for an extra roll.');
  await saveGame(game);
}

async function chooseScore(catId){
  if(!myTurn() || !game.rolledThisTurn || game.gameOver) return;
  if(game.scores[myId][catId] !== -1) return;
  
  const {score} = evalCategory(catId, game.dice);
  game.scores[myId][catId] = score;
  log(game, game.players[game.turnIndex].name+' scored "'+CATS.find(c=>c.id===catId).label+'": '+score+' points.');
  
  const bothDone = game.players.every(p => CATS.every(c => game.scores[p.id][c.id] !== -1));
  if(bothDone){
    game.gameOver = true;
  } else {
    game.turnIndex = (game.turnIndex+1) % game.players.length;
    game.dice = [0,0,0,0,0,0];
    game.held = [false,false,false,false,false,false];
    game.rollsLeft = 3;
    game.usedExtraThisTurn = false;
    game.rolledThisTurn = false;
  }
  await saveGame(game);
}

async function resetGame(){
  if(!game) return;
  if(!confirm('Start a new game? Current scores will be lost.')) return;
  const players = game.players;
  const g = newGame();
  g.players = players;
  players.forEach(p=>{ g.chipsLeft[p.id]=3; g.scores[p.id]=emptyScores(); });
  log(g, 'New game started.');
  await saveGame(g);
}

function upperSum(pid){ return CATS.filter(c=>c.sec==='upper').reduce((s,c)=> s + (game.scores[pid][c.id] === -1 ? 0 : game.scores[pid][c.id]), 0); }
function upperAllFilled(pid){ return CATS.filter(c=>c.sec==='upper').every(c=> game.scores[pid][c.id] !== -1); }
function bonus(pid){ if(!upperAllFilled(pid)) return null; return upperSum(pid) >= 73 ? 45 : 0; }
function lowerSum(pid){ return CATS.filter(c=>c.sec==='lower').reduce((s,c)=> s + (game.scores[pid][c.id] === -1 ? 0 : game.scores[pid][c.id]), 0); }
function totalScore(pid){ const b = bonus(pid); return upperSum(pid) + (b||0) + lowerSum(pid); }

const ROTATIONS = [-9, 7, -4, 11, -13, 5];
function diceHtml(){
  const d = game.dice;
  return d.map((v,i)=>{
    const isRed = i===5;
    const empty = v === 0;
    const held = game.held[i];
    const cls = ['die'];
    if(isRed) cls.push('red');
    if(held) cls.push('held');
    if(empty) cls.push('empty');
    const rot = empty ? 0 : ROTATIONS[i];
    return `<div class="${cls.join(' ')}" style="transform:rotate(${rot}deg)${held?' translateY(6px)':''}" ${empty?'':`onclick="toggleHold(${i})"`}>${empty?'':v}</div>`;
  }).join('');
}

function scoreCell(pid, cat){
  if(!game.scores || !game.scores[pid]) return `<td></td>`;
  const val = game.scores[pid][cat.id];
  const isMine = pid===myId;
  const canPick = isMine && myTurn() && game.rolledThisTurn && !game.gameOver && val === -1;
  if(val !== -1) return `<td class="score">${val}</td>`;
  if(canPick) return `<td class="score mine" onclick="chooseScore('${cat.id}')"><span class="empty-preview">–</span></td>`;
  return `<td class="score"><span class="empty-preview">–</span></td>`;
}

function avatarHtml(player, colorClass, isTurn){
  const initial = player.name.trim().charAt(0).toUpperCase() || '?';
  return `
    <div class="avatar-wrap">
      <div class="avatar ${colorClass} ${isTurn?'turn':''}">${initial}</div>
      <div class="avatar-name ${isTurn?'turn':''}">${player.name}</div>
    </div>
  `;
}

function bannerText(){
  if(!myTurn()) return 'Turn of '+game.players[game.turnIndex].name+'. Please wait.';
  if(game.rollsLeft===3 && !game.rolledThisTurn) return 'Your turn: roll the dice.';
  if(game.rollsLeft>0) return 'Click the dice you want to keep. Rolls left: '+game.rollsLeft;
  return 'Choose a combination on the board to score.';
}

function render(){
  const app = document.getElementById('app');

  if(phase==='join'){
    app.innerHTML = `
      <h1>Kniffel Extreme</h1>
      <p class="sub">6 dice (5 white + 1 red), 22 combinations, extra roll chips.</p>
      <div class="card" style="max-width:420px;margin:0 auto">
        <label>Who are you?</label>
        <div class="picker" style="margin-top:10px">
          <button class="btn-primary" onclick="quickJoin('${PLAYER_NAMES[0]}')">${PLAYER_NAMES[0]}</button>
          <button class="btn-primary" onclick="quickJoin('${PLAYER_NAMES[1]}')">${PLAYER_NAMES[1]}</button>
        </div>
        ${joinError?`<div class="err">${joinError}</div>`:''}
      </div>
    `;
    return;
  }

  if(phase==='waiting'){
    app.innerHTML = `
      <h1>Kniffel Extreme</h1>
      <div class="card" style="text-align:center;max-width:420px;margin:0 auto">
        <p style="font-family:'Fraunces',serif;font-size:18px;margin:0 0 6px">Waiting for the other player to join...</p>
        <p class="sub" style="margin:0">Ask the other player to open this same page and pick their name.</p>
      </div>
    `;
    return;
  }

  // play
  const me = game.players.find(p=>p.id===myId) || game.players[0];
  const opp = opponent() || game.players[1];
  if(!me || !opp) return;

  const canRoll = myTurn() && game.rollsLeft>0 && !game.gameOver;
  const canExtra = myTurn() && game.rollsLeft===0 && !game.usedExtraThisTurn && (game.chipsLeft[myId]||0)>0 && !game.gameOver;
  const meIsTurn = myTurn();

  const upperRows = CATS.filter(c=>c.sec==='upper').map(c=>`<tr><td class="cat">${c.label}</td>${scoreCell(me.id,c)}${scoreCell(opp.id,c)}</tr>`).join('');
  const bonusMineVal = bonus(me.id);
  const bonusOppVal = bonus(opp.id);
  const lowerRows = CATS.filter(c=>c.sec==='lower').map(c=>`<tr><td class="cat">${c.label}</td>${scoreCell(me.id,c)}${scoreCell(opp.id,c)}</tr>`).join('');

  const chipsHtml = (pid)=>{
    const used = 3-(game.chipsLeft[pid]||0);
    let s='';
    for(let i=0;i<3;i++) s += `<span class="chip ${i<used?'spent':''}"></span>`;
    return s;
  };

  const leftPanel = game.gameOver ? `
      <div class="card">
        <div class="winner-banner">${totalScore(me.id)===totalScore(opp.id) ? 'Draw!' : (totalScore(me.id)>totalScore(opp.id) ? 'You won!' : opp.name+' won!')}</div>
        <div class="meta"><span><b>${me.name}</b>: ${totalScore(me.id)} points</span></div>
        <div class="meta"><span><b>${opp.name}</b>: ${totalScore(opp.id)} points</span></div>
        <div style="text-align:center;margin-top:10px"><button class="btn-primary" onclick="resetGame()">New Game</button></div>
      </div>
  ` : `
      <div class="players-row">
        ${avatarHtml(me, 'gold', meIsTurn)}
        ${avatarHtml(opp, 'red', !meIsTurn)}
      </div>
      <div class="banner">${bannerText()}</div>
      <div class="dice-tray">${diceHtml()}</div>
      <div class="controls">
        <button class="btn-primary" onclick="rollDice()" ${canRoll?'':'disabled'}>Roll Dice (${game.rollsLeft})</button>
      </div>
      <div class="controls-secondary">
        <button class="btn-red" onclick="useChip()" ${canExtra?'':'disabled'}>Use Chip → 4th Roll</button>
        <button class="btn-ghost" onclick="resetGame()">New Game</button>
      </div>
      <div class="meta">
        <span>Your Chips: ${chipsHtml(me.id)}</span>
        <span>${opp.name}'s Chips: ${chipsHtml(opp.id)}</span>
      </div>
  `;

  app.innerHTML = `
    <h1>Kniffel Extreme</h1>
    <div class="board">
      <div>${leftPanel}</div>
      <div>
        <div class="card">
          <table>
            <thead><tr><th></th><th>${me.name}</th><th>${opp.name}</th></tr></thead>
            <tbody>
              ${upperRows}
              <tr><td class="cat">Bonus (from 73)</td><td class="score">${bonusMineVal===null?'<span class="empty-preview">–</span>':bonusMineVal}</td><td class="score">${bonusOppVal===null?'<span class="empty-preview">–</span>':bonusOppVal}</td></tr>
              <tr class="section-label"><td colspan="3">Lower Section</td></tr>
              ${lowerRows}
              <tr><td class="cat" style="font-weight:800">Total Score</td><td class="score" style="font-weight:800">${totalScore(me.id)}</td><td class="score" style="font-weight:800">${totalScore(opp.id)}</td></tr>
            </tbody>
          </table>
        </div>
        <div class="card">
          <label>Game Log</label>
          <div class="log">${game.log.slice().reverse().map(l=>`<div>${l}</div>`).join('')}</div>
        </div>
      </div>
    </div>
  `;
}

render();
</script>
</body>
</html>
